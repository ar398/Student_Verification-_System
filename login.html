<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Scholarship Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/glass.css">
    <style>
        .auth-card {
            animation: modalFadeIn 0.5s ease-out;
        }
        @keyframes modalFadeIn {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body style="background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f172a); background-size: 400% 400%; animation: gradientBG 15s ease infinite;">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <nav class="navbar" style="position: absolute;">
        <a href="index.html" class="nav-logo">
            <i class="ph-fill ph-graduation-cap" style="color: var(--primary-color); font-size: 2rem;"></i>
            ScholarVerify
        </a>
    </nav>

    <div class="auth-container" style="padding: 100px 0;">
        <div class="glass-card auth-card" style="max-width: 450px;">
            <h2><i class="ph-fill ph-user-circle" style="vertical-align: middle; margin-right: 8px; color: var(--primary-color);"></i> Welcome Back</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                    Login <i class="ph ph-arrow-right" style="margin-left: 8px;"></i>
                </button>
            </form>
            <p class="text-center mt-2">
                Don't have an account? <a href="signup.html" style="color: var(--primary-color); font-weight: bold;">Register here</a>
            </p>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
